version: 2
project_name: auto-mr
before:
  hooks:
    - go mod download
builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -X main.version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: arm
        goarm: "7"
      - goos: windows
        goarch: arm
        goarm: "6"

archives:
  - name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    formats: ['binary']

checksum:
  # https://goreleaser.com/customization/checksum/
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# Homebrew cask publishing (replaces the deprecated `brews:` block; casks are
# what GoReleaser supports going forward)
homebrew_casks:
  - name: auto-mr
    homepage: 'https://github.com/sgaunet/auto-mr'
    description: 'Automated merge requests for GitLab, GitHub and self-hosted Forgejo'

    # Tap repository directory (casks live in Casks/, not Formula/)
    directory: Casks

    # Command name users invoke, mapped from the artifact name.
    binaries:
      - auto-mr

    # Download URL of the release artifact.
    url:
      template: 'https://github.com/sgaunet/auto-mr/releases/download/{{ .Tag }}/{{ .ArtifactName }}'

    # Strip the Gatekeeper quarantine xattr so the installed binary can run.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}"]
          end

    commit_author:
      name: sgaunet
      email: 1552102+sgaunet@users.noreply.github.com

    repository:
      owner: sgaunet
      name: homebrew-tools
      # Token with 'repo' scope is required for pushing to a different repository
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'