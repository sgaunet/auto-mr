---
version: "2"
# Configure which files to skip during linting
run:
  # Test files are linted too. Without this, dead helpers and unchecked errors in
  # ~9,000 lines of test code were invisible to the quality gate the project relies
  # on -- including tests that asserted nothing.
  tests: true

linters:
  default: all

  disable:
    - wsl
    - wsl_v5
    - nlreturn
    - depguard
    - gochecknoinits
    - gochecknoglobals
    - forbidigo
    - varnamelen
    - exhaustruct
    - tagliatelle
    - noinlineerr
    - gomodguard
    # The suite deliberately does not use t.Parallel: several tests set environment
    # variables or change directory, which parallel tests cannot do safely. These two
    # linters would flag every test function for a decision already made.
    - paralleltest
    - tparallel
  exclusions:
    rules:
      # Structural and stylistic linters tuned for production code are noise in tests,
      # where long table literals and repeated fixture strings are the point. The
      # correctness linters -- errcheck, staticcheck, govet, unused, gosec -- stay on.
      - path: '_test\.go'
        linters:
          - funlen
          - dupl
          - gocyclo
          - cyclop
          - gocognit
          - maintidx
          - nestif
          - mnd
          - lll
          - wrapcheck
          - err113
          - goconst
          - forcetypeassert
          - ireturn
          - containedctx
          - contextcheck
          - errcheck
          # Test helpers that take one value today are written for extension; a
          # helper's shape is not a defect.
          - unparam
          # gosec's warnings invert in test code: the "hardcoded credentials" it
          # objects to are the deliberately fake tokens the security tests exist to
          # check, the permissive modes are inside t.TempDir, and the variable
          # subprocess is a helper invoking git. Production code keeps gosec on.
          - gosec
          # Non-Latin script in the sanitizer tests is deliberate input.
          - gosmopolitan
      - path: 'pkg/git/export_test\.go'
        linters:
          # (nil, nil) is the meaningful result here: no credential was attached and
          # nothing went wrong. A sentinel would blur exactly what is being tested.
          - nilnil
      # package main has no import path, so its tests cannot live in an external test
      # package the way every other package's do.
      - path: 'main_test\.go'
        linters:
          - testpackage